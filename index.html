<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CozyPod">
    <title>CozyPod — Private 4-Player Lounge & Turn-Based Arcade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #8b5cf6;
            --accent-glow: rgba(139, 92, 246, 0.45);
        }
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 9999px;
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        @keyframes popIn {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-float {
            animation: floatSlow 3s ease-in-out infinite;
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .btn-game {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-game:active {
            transform: translateY(2px) scale(0.97);
        }
        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
        }
        .mic-active {
            animation: micPulse 1.4s infinite;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        /* ---------- Collapsible chrome (header/footer auto-hide) ---------- */
        #appHeader, #appNav {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.25s ease, padding-top 0.3s ease, padding-bottom 0.3s ease, border-width 0.3s ease;
        }
        body.chrome-collapsed #appHeader, body.chrome-collapsed #appNav {
            opacity: 0;
            padding-top: 0 !important;
            padding-bottom: 0 !important;
            border-top-width: 0 !important;
            border-bottom-width: 0 !important;
        }
        /* ---------- Non-gaming interaction lockdown ---------- */
        html, body {
            overscroll-behavior: none;
            touch-action: pan-x pan-y;
        }
        body {
            -webkit-touch-callout: none;
        }
        input, textarea, select {
            -webkit-user-select: text;
            user-select: text;
            -webkit-touch-callout: default;
        }
        img {
            -webkit-user-drag: none;
        }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full max-w-md md:max-w-4xl mx-auto bg-slate-950 border-x border-slate-800/80 shadow-2xl relative overflow-hidden">

    <div id="splashScreen" class="absolute inset-0 bg-slate-950/98 backdrop-blur-xl z-50 flex flex-col items-center justify-center p-6 text-center animate-pop">
        <div class="w-16 h-16 rounded-3xl bg-gradient-to-br from-violet-500 via-fuchsia-500 to-amber-500 flex items-center justify-center shadow-2xl shadow-violet-500/30 mb-3 animate-float">
            <i class="fa-solid fa-gamepad text-white text-2xl"></i>
        </div>
        <h1 class="font-display font-extrabold text-2xl text-white tracking-wider mb-1">COZYPOD</h1>
        <p class="text-xs text-slate-400 mb-5">Private 4-Player Lounge & Turn Arcade</p>

        <div class="w-full max-w-xs space-y-2.5 mb-5">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 flex items-center gap-3">
                <div id="splashAvatarPreview" class="w-11 h-11 rounded-xl bg-slate-950 border border-violet-500/40 flex items-center justify-center shrink-0"></div>
                <input id="splashNameInput" type="text" maxlength="14" placeholder="Your Name"
                    class="flex-1 bg-slate-950 border border-slate-700 focus:border-violet-500 rounded-xl px-3 py-2 text-xs font-bold text-white outline-none">
            </div>

            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-violet-500/20 border border-violet-500/40 flex items-center justify-center text-violet-300 shrink-0">
                    <i class="fa-solid fa-key"></i>
                </div>
                <input id="splashRoomInput" type="text" maxlength="12" value="SQUAD-4"
                    class="flex-1 bg-slate-950 border border-slate-700 focus:border-violet-500 rounded-xl px-3 py-2 text-xs font-bold uppercase tracking-widest text-white outline-none">
            </div>
        </div>

        <div class="w-full max-w-xs space-y-2">
            <button onclick="enterLoungeFromSplash()" class="btn-game w-full py-3 rounded-2xl bg-gradient-to-r from-violet-600 via-fuchsia-600 to-amber-500 text-white font-display font-bold text-sm shadow-xl shadow-violet-600/30">
                Enter Lounge
            </button>
            <button onclick="handleGoogleSignIn()" class="btn-game w-full py-2.5 rounded-2xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-white font-bold text-xs flex items-center justify-center gap-2">
                <i class="fa-brands fa-google text-amber-400"></i>
                <span id="googleAuthText">Sign In with Google</span>
            </button>
        </div>
    </div>

    <header id="appHeader" class="flex items-center justify-between px-2 py-1 bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <button onclick="openSplashMenu()" class="btn-game text-xs font-display font-bold uppercase tracking-wider px-2 py-1 rounded-xl bg-violet-500/20 text-violet-300 border border-violet-500/30 flex items-center gap-1.5">
                <i class="fa-solid fa-gamepad text-[10px]"></i>
                <span id="headerRoomText">SQUAD-4</span>
            </button>
            <div id="coinBadge" class="text-xs font-bold text-amber-400 bg-amber-500/15 border border-amber-500/30 px-2 py-0.5 rounded-xl flex items-center gap-1">
                <i class="fa-solid fa-coins text-[10px]"></i>
                <span id="coinCountVal">50</span>
            </div>
        </div>

        <div class="flex items-center gap-1.5">
            <button id="micBtn" onclick="toggleVoiceChat()" class="btn-game px-2 h-7 rounded-xl bg-slate-800/90 border border-slate-700/70 text-slate-400 flex items-center gap-1.5 text-xs font-bold">
                <i class="fa-solid fa-microphone-slash" id="micIcon"></i>
                <span id="micPeerCount" class="hidden text-[10px] bg-emerald-500 text-slate-950 px-1 rounded-full font-extrabold">0</span>
            </button>
            <button onclick="toggleBgm()" id="bgmBtn" class="btn-game w-7 h-7 rounded-xl bg-violet-500/20 border border-violet-500/40 text-violet-300 flex items-center justify-center text-xs">
                <i class="fa-solid fa-music" id="bgmIcon"></i>
            </button>
            <button onclick="toggleSound()" id="soundBtn" class="btn-game w-7 h-7 rounded-xl bg-slate-800/90 border border-slate-700/70 text-emerald-400 flex items-center justify-center text-xs">
                <i class="fa-solid fa-volume-high" id="soundIcon"></i>
            </button>
            <button onclick="openDeployModal()" class="btn-game w-7 h-7 rounded-xl bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 flex items-center justify-center text-xs">
                <i class="fa-solid fa-rocket"></i>
            </button>
        </div>
    </header>

    <div class="bg-slate-900/60 border-b border-slate-800/60 px-2 py-0.5 flex items-center justify-between gap-2 overflow-x-auto no-scrollbar z-10 shrink-0">
        <div id="playerRosterBar" class="flex items-center gap-1.5"></div>
        <div class="flex items-center gap-1 shrink-0">
            <button onclick="throwFunItem('confetti')" class="btn-game w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm flex items-center justify-center border border-slate-700/80">🎉</button>
            <button onclick="throwFunItem('plane')" class="btn-game w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm flex items-center justify-center border border-slate-700/80">✈️</button>
            <button onclick="throwFunItem('boba')" class="btn-game w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm flex items-center justify-center border border-slate-700/80">🧋</button>
        </div>
    </div>

    <div class="bg-slate-950 border-b border-slate-800/60 px-2 py-0.5 flex items-center gap-2 z-10 shrink-0">
        <span id="xpLevelLabel" class="text-[10px] font-bold text-violet-300 font-display whitespace-nowrap">Lv 1</span>
        <div class="flex-1 h-1.5 bg-slate-800 rounded-full overflow-hidden"><div id="xpBarFill" class="h-full bg-gradient-to-r from-violet-500 to-fuchsia-400 rounded-full transition-all" style="width:0%"></div></div>
        <span id="xpTextLabel" class="text-[10px] text-slate-400 font-bold whitespace-nowrap">0/100</span>
    </div>

    <main class="flex-1 relative overflow-hidden flex flex-col">

        <!-- VIEW 1: LIVE INTERACTIVE LOUNGE -->
        <section id="view-lounge" class="flex-1 relative flex flex-col overflow-hidden">
            <div id="canvasContainer" class="relative flex-1 w-full bg-slate-950 overflow-hidden">
                <canvas id="lobbyCanvas"></canvas>

                <!-- Environment & Toybox Quick Toggles Bar -->
                <div class="absolute top-2.5 right-2.5 flex items-center gap-1.5 pointer-events-auto">
                    <button onclick="toggleWeather()" class="btn-game w-8 h-8 rounded-xl bg-slate-900/85 backdrop-blur-md border border-slate-700/80 text-violet-300 text-xs flex items-center justify-center shadow-lg" title="Weather">
                        🌧️
                    </button>
                    <button onclick="toggleGravity()" class="btn-game w-8 h-8 rounded-xl bg-slate-900/85 backdrop-blur-md border border-slate-700/80 text-amber-300 text-xs flex items-center justify-center shadow-lg" title="Gravity">
                        🎈
                    </button>
                    <button onclick="spawnGachaCapsule()" class="btn-game px-2.5 h-8 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold text-xs flex items-center gap-1 shadow-lg" title="Gacha Toy">
                        <span>🎁</span>
                        <span id="gachaCoinCost">20</span>
                    </button>
                </div>

                <!-- Active Turn Pill -->
                <div id="liveGameBanner" class="hidden absolute top-2.5 left-2.5 bg-slate-900/90 backdrop-blur-md border border-violet-500/40 rounded-full pl-2.5 pr-1.5 py-1 shadow-xl flex items-center gap-2 animate-pop">
                    <span id="bannerGameIcon" class="text-xs">🎲</span>
                    <span id="bannerTurnStatus" class="text-[11px] font-bold text-violet-200"></span>
                    <button onclick="switchTab('games')" class="btn-game px-2.5 py-0.5 rounded-full bg-violet-500 text-white font-bold text-[10px]">
                        Play
                    </button>
                </div>

                <!-- Emote Bar -->
                <div class="absolute bottom-2.5 left-2.5 right-2.5 flex items-center justify-between pointer-events-none">
                    <div class="pointer-events-auto flex items-center gap-1 bg-slate-900/85 backdrop-blur-md border border-slate-700/80 p-1 rounded-2xl shadow-xl">
                        <button onclick="triggerEmote('👋')" class="btn-game w-8 h-8 rounded-xl hover:bg-slate-800 flex items-center justify-center text-base">👋</button>
                        <button onclick="triggerEmote('😂')" class="btn-game w-8 h-8 rounded-xl hover:bg-slate-800 flex items-center justify-center text-base">😂</button>
                        <button onclick="triggerEmote('🔥')" class="btn-game w-8 h-8 rounded-xl hover:bg-slate-800 flex items-center justify-center text-base">🔥</button>
                        <button onclick="triggerEmote('❤️')" class="btn-game w-8 h-8 rounded-xl hover:bg-slate-800 flex items-center justify-center text-base">❤️</button>
                        <button onclick="triggerEmote('👀')" class="btn-game w-8 h-8 rounded-xl hover:bg-slate-800 flex items-center justify-center text-base">👀</button>
                        <button onclick="triggerEmote('🕺')" class="btn-game w-8 h-8 rounded-xl bg-violet-600/30 border border-violet-500/40 flex items-center justify-center text-base">🕺</button>
                    </div>

                    <button onclick="openPixelWallModal()" class="pointer-events-auto btn-game w-10 h-10 rounded-2xl bg-slate-900/90 backdrop-blur-md border border-fuchsia-500/40 text-fuchsia-300 text-sm flex items-center justify-center shadow-xl">
                        <i class="fa-solid fa-spray-can-sparkles"></i>
                    </button>
                </div>
            </div>
        </section>

        <!-- VIEW 2: MULTI-GAME ARCADE SUITE (FITS SINGLE SCREEN) -->
        <section id="view-games" class="hidden flex-1 flex flex-col bg-slate-950 overflow-hidden p-2 gap-1.5">
            <!-- Game Selector Carousel Strip -->
            <div class="grid grid-cols-6 gap-1.5 shrink-0 overflow-x-auto no-scrollbar">
                <button onclick="selectArcadeMode('connect4')" id="gameTab-connect4" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-violet-600/25 border-violet-500 text-white">
                    <span class="text-sm">🔴</span>
                    <span class="font-bold text-[10px]">Drop4</span>
                </button>
                <button onclick="selectArcadeMode('wordbomb')" id="gameTab-wordbomb" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-300">
                    <span class="text-sm">💣</span>
                    <span class="font-bold text-[10px]">Bomb</span>
                </button>
                <button onclick="selectArcadeMode('trivia')" id="gameTab-trivia" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-300">
                    <span class="text-sm">🧠</span>
                    <span class="font-bold text-[10px]">Trivia</span>
                </button>
                <button onclick="selectArcadeMode('melody')" id="gameTab-melody" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-300">
                    <span class="text-sm">🎹</span>
                    <span class="font-bold text-[10px]">Melody</span>
                </button>
                <button onclick="selectArcadeMode('reflex')" id="gameTab-reflex" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-300">
                    <span class="text-sm">⚡</span>
                    <span class="font-bold text-[10px]">Reflex</span>
                </button>
                <button onclick="selectArcadeMode('hottakes')" id="gameTab-hottakes" class="btn-game py-2 px-2.5 rounded-2xl border flex flex-col items-center justify-center gap-1 bg-slate-900 border-slate-800 text-slate-300">
                    <span class="text-sm">👑</span>
                    <span class="font-bold text-[10px]">Vote</span>
                </button>
            </div>

            <!-- Active Game Stage Container -->
            <div class="flex-1 bg-slate-900/80 border border-slate-800 rounded-3xl p-3 flex flex-col justify-between relative overflow-hidden">
                
                <!-- MINI-GAME: CONNECT 4 (DROP 4) -->
                <div id="stage-connect4" class="flex-1 flex flex-col justify-between overflow-hidden">
                    <div class="flex items-center justify-between shrink-0">
                        <div id="c4TurnOrderPills" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
                        <button onclick="resetConnect4()" class="btn-game w-7 h-7 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 flex items-center justify-center">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    <div class="flex-1 flex items-center justify-center overflow-hidden my-1">
                        <div id="c4BoardContainer" class="bg-slate-950 p-2 rounded-2xl border-2 border-slate-800 shadow-inner w-full max-w-[280px]">
                            <div id="c4Grid" class="grid grid-cols-7 gap-1.5"></div>
                        </div>
                    </div>
                </div>

                <!-- MINI-GAME: SYLLABLE BOMB -->
                <div id="stage-wordbomb" class="hidden flex-1 flex flex-col justify-between overflow-hidden">
                    <div class="flex items-center justify-between shrink-0">
                        <div id="bombTurnBadge" class="px-2.5 py-1 rounded-full bg-violet-500/20 border border-violet-500/40 text-violet-200 text-xs font-bold"></div>
                        <button onclick="startNewWordBombRound()" class="btn-game w-7 h-7 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs flex items-center justify-center">
                            <i class="fa-solid fa-rotate-right"></i>
                        </button>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center text-center">
                        <div class="relative w-24 h-24 rounded-full bg-gradient-to-b from-slate-800 to-slate-950 border-4 border-amber-500/70 flex flex-col items-center justify-center shadow-2xl mb-2">
                            <span id="bombSyllableText" class="font-display font-extrabold text-3xl text-white tracking-wider">ST</span>
                            <span id="bombUsedCount" class="text-[10px] text-amber-400 font-bold">0</span>
                        </div>
                        <p id="bombLastWordText" class="text-xs text-emerald-400 font-bold h-4"></p>
                    </div>
                    <form onsubmit="submitBombWord(event)" class="flex gap-1.5 shrink-0">
                        <input type="text" id="bombWordInput" placeholder="Word..." autocomplete="off"
                            class="flex-1 bg-slate-950 border border-slate-700 focus:border-amber-400 rounded-xl px-3 py-2 text-sm text-white outline-none">
                        <button type="submit" class="btn-game px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-bold text-xs">
                            💣
                        </button>
                    </form>
                </div>

                <!-- MINI-GAME: TRIVIA GAME SHOW -->
                <div id="stage-trivia" class="hidden flex-1 flex flex-col justify-between overflow-hidden gap-2">
                    <div class="bg-gradient-to-br from-violet-950 to-slate-900 border border-violet-500/40 rounded-2xl p-3 flex items-center justify-between shrink-0">
                        <span id="triviaCategoryTag" class="text-[10px] font-bold text-violet-300 uppercase tracking-wider">Pop Culture</span>
                        <button onclick="nextTriviaQuestion()" class="btn-game w-7 h-7 rounded-xl bg-violet-500/20 text-violet-200 text-xs flex items-center justify-center">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                    </div>
                    <div class="flex-1 flex flex-col justify-center gap-3">
                        <h3 id="triviaQuestionText" class="font-display font-bold text-sm text-white text-center">Question?</h3>
                        <div id="triviaOptionsGrid" class="grid grid-cols-2 gap-2"></div>
                    </div>
                </div>

                <!-- MINI-GAME: MELODY RELAY (SIMON SAYS) -->
                <div id="stage-melody" class="hidden flex-1 flex flex-col justify-between overflow-hidden gap-2">
                    <div class="flex items-center justify-between shrink-0">
                        <span id="melodyScoreText" class="text-xs font-bold text-amber-400">Sequence: 0</span>
                        <button onclick="startMelodySequence()" class="btn-game px-3 py-1 rounded-xl bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold">
                            Play Tone
                        </button>
                    </div>
                    <div class="flex-1 grid grid-cols-2 gap-2.5 content-center max-w-[260px] mx-auto w-full">
                        <button onclick="tapMelodyPad(0)" id="melodyPad-0" class="btn-game aspect-square rounded-2xl bg-violet-600/30 border-2 border-violet-500/60 flex items-center justify-center text-2xl">🎹</button>
                        <button onclick="tapMelodyPad(1)" id="melodyPad-1" class="btn-game aspect-square rounded-2xl bg-fuchsia-600/30 border-2 border-fuchsia-500/60 flex items-center justify-center text-2xl">🎸</button>
                        <button onclick="tapMelodyPad(2)" id="melodyPad-2" class="btn-game aspect-square rounded-2xl bg-emerald-600/30 border-2 border-emerald-500/60 flex items-center justify-center text-2xl">🎷</button>
                        <button onclick="tapMelodyPad(3)" id="melodyPad-3" class="btn-game aspect-square rounded-2xl bg-amber-600/30 border-2 border-amber-500/60 flex items-center justify-center text-2xl">🎻</button>
                    </div>
                </div>

                <!-- MINI-GAME: REFLEX SHOWDOWN -->
                <div id="stage-reflex" class="hidden flex-1 flex flex-col items-center justify-between p-4 overflow-hidden text-center">
                    <div id="reflexStatusHeader" class="font-display font-bold text-sm text-amber-400">Ready for the Signal?</div>
                    <button onclick="triggerReflexBuzzer()" id="reflexBuzzerBtn" class="btn-game w-32 h-32 rounded-full bg-gradient-to-br from-red-600 to-orange-600 border-4 border-amber-400/80 shadow-2xl flex items-center justify-center text-3xl font-extrabold text-white">
                        BUZZ
                    </button>
                    <p id="reflexResultText" class="text-xs text-slate-300 h-6 font-bold"></p>
                </div>

                <!-- MINI-GAME: VOTE (MOST LIKELY TO) -->
                <div id="stage-hottakes" class="hidden flex-1 flex flex-col justify-between overflow-hidden gap-2">
                    <div class="bg-gradient-to-br from-violet-950/90 via-slate-900 to-fuchsia-950/80 border border-violet-500/30 rounded-2xl p-3 text-center flex items-center justify-between gap-2 shrink-0">
                        <h3 id="hotTakeQuestionText" class="font-display font-bold text-xs sm:text-sm text-white text-left flex-1"></h3>
                        <button onclick="nextHotTakePrompt()" class="btn-game w-8 h-8 rounded-xl bg-fuchsia-500/20 border border-fuchsia-500/40 text-fuchsia-300 text-xs flex items-center justify-center shrink-0">
                            <i class="fa-solid fa-shuffle"></i>
                        </button>
                    </div>
                    <div id="hotTakeCandidatesGrid" class="grid grid-cols-2 gap-2 flex-1 content-center overflow-y-auto"></div>
                </div>

            </div>
        </section>

        <!-- VIEW 3: AVATAR WARDROBE & TROPHY SHELF -->
        <section id="view-wardrobe" class="hidden flex-1 flex flex-col bg-slate-950 overflow-hidden p-2.5 gap-2">
            <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 flex items-center gap-3 shrink-0">
                <div class="relative w-15 h-15 rounded-xl bg-slate-950 border border-violet-500/40 flex items-center justify-center shrink-0">
                    <div id="wardrobeAvatarPreview" class="w-14 h-14"></div>
                </div>
                <div class="flex-1 flex flex-col gap-1.5">

        // --- STREAMING_CHUNK:Initializing Procedural Audio Engine (SFX & BGM)... ---
        let soundEnabled = true;
        let bgmEnabled = true;
        let bgmStarted = false;
        let audioCtx = null;
        let bgmStep = 0;
        let bgmIntervalId = null;
        let noiseBuffer = null;
        let jukeboxPlaying = true;
        let currentVibeIndex = 0;

        function ensureAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const bufferSize = audioCtx.sampleRate * 1.5;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (bgmEnabled && !bgmStarted) {
                startProceduralBgmLoop();
            }
        }

        window.addEventListener('pointerdown', () => ensureAudioContext(), { once: true });
        window.addEventListener('keydown', () => ensureAudioContext(), { once: true });

        function playNoiseBurst(duration = 0.08, filterType = 'bandpass', freq = 1200, q = 2, gainVal = 0.08) {
            if (!soundEnabled || !audioCtx || !noiseBuffer) return;
            const now = audioCtx.currentTime;
            const src = audioCtx.createBufferSource();
            src.buffer = noiseBuffer;
            const filter = audioCtx.createBiquadFilter();
            filter.type = filterType;
            filter.frequency.setValueAtTime(freq, now);
            filter.Q.value = q;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(gainVal, now);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
            src.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            src.start(now);
            src.stop(now + duration);
        }

        function playTone(type = 'pop', customFreq = 420) {
            if (!soundEnabled) return;
            try {
                ensureAudioContext();
                const now = audioCtx.currentTime;
                if (type === 'pop') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(customFreq, now);
                    osc.frequency.exponentialRampToValueAtTime(customFreq * 2, now + 0.075);
                    gain.gain.setValueAtTime(0.11, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.085);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.085);
                } else if (type === 'spray') {
                    playNoiseBurst(0.09, 'highpass', 2400, 1.2, 0.06);
                } else if (type === 'slurp') {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(260, now);
                    osc.frequency.exponentialRampToValueAtTime(690, now + 0.14);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'disc') {
                    [0, 0.07].forEach((offset, i) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(320 + i * 100, now + offset);
                        gain.gain.setValueAtTime(0.14, now + offset);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.05);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + offset);
                        osc.stop(now + offset + 0.05);
                    });
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, now + idx * 0.075);
                        gain.gain.setValueAtTime(0.12, now + idx * 0.075);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.075 + 0.25);
                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + idx * 0.075);
                        osc.stop(now + idx * 0.075 + 0.25);
                    });
                }
            } catch (e) {}
        }

        function playVocalChatBlips(text, speakerName = '') {
            if (!soundEnabled) return;
            try {
                ensureAudioContext();
                const seed = speakerName.split('').reduce((acc, ch) => acc + ch.charCodeAt(0), 0);
                const basePitch = 300 + (seed % 180);
                const letters = text.replace(/[^a-zA-Z0-9]/g, '').slice(0, 8).split('');
                const now = audioCtx.currentTime;
                letters.forEach((char, i) => {
                    const offset = i * 0.05;
                    const freq = basePitch + ((char.toLowerCase().charCodeAt(0) * 17) % 150);
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(freq, now + offset);
                    gain.gain.setValueAtTime(0.05, now + offset);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.04);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + offset);
                    osc.stop(now + offset + 0.045);
                });
            } catch (e) {}
        }

        const BGM_PATTERNS = [
            { wave: 'triangle', chords: [
                [261.63, 329.63, 392.00],
                [220.00, 261.63, 329.63],
                [174.61, 220.00, 261.63],
                [196.00, 246.94, 293.66]
            ] },
            { wave: 'sine', chords: [
                [293.66, 369.99, 440.00],
                [246.94, 293.66, 369.99],
                [261.63, 329.63, 392.00],
                [220.00, 277.18, 329.63]
            ] }
        ];
        const BGM_PENTA = [0, 2, 4, 7, 9];
        let bgmMelodyCache = { key: -1, notes: [] };
        function bgmSeedRand(seed) {
            let t = seed >>> 0;
            return function() {
                t += 0x6D2B79F5;
                let r = Math.imul(t ^ (t >>> 15), t | 1);
                r ^= r + Math.imul(r ^ (r >>> 7), r | 61);
                return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
            };
        }
        function bgmNote(freq, when, dur, wave, vol) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = wave;
            osc.frequency.setValueAtTime(freq, when);
            gain.gain.setValueAtTime(vol, when);
            gain.gain.exponentialRampToValueAtTime(0.0008, when + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(when);
            osc.stop(when + dur + 0.1);
        }
        function bgmBarMelody(pattern, bar, loop) {
            const key = loop * 64 + bar;
            if (bgmMelodyCache.key === key) return bgmMelodyCache.notes;
            const rnd = bgmSeedRand(loop * 7919 + bar * 131 + 7);
            const root = pattern.chords[bar % pattern.chords.length][0];
            let deg = 2 + Math.floor(rnd() * 3);
            const notes = [];
            for (let s = 0; s < 8; s++) {
                if (rnd() < 0.32) { notes.push(0); continue; }
                deg += [-2, -1, -1, 0, 1, 1, 2][Math.floor(rnd() * 7)];
                deg = Math.max(0, Math.min(9, deg));
                const semis = BGM_PENTA[deg % 5] + Math.floor(deg / 5) * 12;
                notes.push(root * 2 * Math.pow(2, semis / 12));
            }
            bgmMelodyCache = { key: key, notes: notes };
            return notes;
        }

        function triggerBgmStep() {
            if (!bgmEnabled || !jukeboxPlaying || !audioCtx || audioCtx.state !== 'running') return;
            const pattern = BGM_PATTERNS[currentVibeIndex % BGM_PATTERNS.length];
            const step = bgmStep % 64;
            const bar = Math.floor(step / 16);
            const s16 = step % 16;
            const loop = Math.floor(bgmStep / 64);
            const now = audioCtx.currentTime;
            const chord = pattern.chords[bar % pattern.chords.length];

            if (s16 === 0) {
                chord.forEach(freq => bgmNote(freq, now, 3.4, pattern.wave, 0.014));
                bgmNote(chord[0] / 2, now, 3.0, 'sine', 0.02);
            }
            if (s16 === 8) {
                bgmNote(chord[2] * 2, now, 1.4, 'sine', 0.007);
            }
            if (s16 === 4 || s16 === 12) {
                try { playNoiseBurst(0.05, 'highpass', 6000, 1.5, 0.012); } catch (e) {}
            }
            if (s16 % 2 === 0) {
                const mel = bgmBarMelody(pattern, bar, loop);
                const f = mel[s16 / 2];
                if (f) bgmNote(f, now, 0.55, pattern.wave, 0.019);
            }
            bgmStep++;
        }

        function startProceduralBgmLoop() {
            if (bgmIntervalId) clearInterval(bgmIntervalId);
            bgmStarted = true;
            bgmIntervalId = setInterval(triggerBgmStep, 180);

        window.toggleBgm = function () {

            const btn = document.getElementById('bgmBtn');
            const icon = document.getElementById('bgmIcon');

                icon.className = 'fa-solid fa-volume-off';
            }
        };

        window.toggleSound = function () {
            ensureAudioContext();
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high text-emerald-400' : 'fa-solid fa-volume-xmark text-slate-500';
            if (soundEnabled) playTone('pop');
        };

        // --- STREAMING_CHUNK:Configuring WebRTC Voice Mesh & Analyser... ---
        let voiceChatActive = false;
        let localMicStream = null;
        let micAnalyser = null;
        let micDataArray = null;
        let myVoiceLevel = 0;
        let peerInstance = null;
        let activeCalls = {};

        window.toggleVoiceChat = async function () {
            ensureAudioContext();
            if (voiceChatActive) {
                stopVoiceChat();
                return;
            }
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                voiceChatActive = true;
                updateMicButtonUI(true);
                playTone('win');

                const micSource = audioCtx.createMediaStreamSource(localMicStream);
                micAnalyser = audioCtx.createAnalyser();
                micAnalyser.fftSize = 128;
                micDataArray = new Uint8Array(micAnalyser.frequencyBinCount);
                micSource.connect(micAnalyser);
                initPeerJsRoomMesh(0);
            } catch (err) {
                voiceChatActive = false;
                updateMicButtonUI(false);
            }
        };

        function stopVoiceChat() {
            voiceChatActive = false;
            myVoiceLevel = 0;
            if (localMicStream) {
                localMicStream.getTracks().forEach(t => t.stop());
                localMicStream = null;
            }
            Object.values(activeCalls).forEach(call => { try { call.close(); } catch (e) {} });
            activeCalls = {};
            if (peerInstance) {
                try { peerInstance.destroy(); } catch (e) {}
                peerInstance = null;
            }
            updateMicButtonUI(false);
        }

        function updateMicButtonUI(isOn) {
            const btn = document.getElementById('micBtn');
            const icon = document.getElementById('micIcon');
            const countEl = document.getElementById('micPeerCount');
            if (isOn) {
                btn.className = 'btn-game px-2.5 h-8 rounded-xl bg-emerald-500/25 border border-emerald-400 text-emerald-300 flex items-center gap-1.5 text-xs font-bold mic-active';
                icon.className = 'fa-solid fa-microphone';
                const connectedCount = Object.keys(activeCalls).length;
                if (connectedCount > 0) {
                    countEl.textContent = connectedCount;
                    countEl.classList.remove('hidden');
                } else {
                    countEl.classList.add('hidden');
                }
            } else {
                btn.className = 'btn-game px-2.5 h-8 rounded-xl bg-slate-800/90 border border-slate-700/70 text-slate-400 flex items-center gap-1.5 text-xs font-bold';
                icon.className = 'fa-solid fa-microphone-slash';
                countEl.classList.add('hidden');
            }
        }

        function getSeatPeerId(slot) {
            return `cozypod-v2-${currentRoomCode.toLowerCase().replace(/[^a-z0-9]/g, '')}-seat-${slot}`;
        }

        function initPeerJsRoomMesh(trySlot = 0) {
            if (!voiceChatActive || !localMicStream || typeof Peer === 'undefined' || trySlot > 3) return;
            const peer = new Peer(getSeatPeerId(trySlot));

        function renderLobbyLoop() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const w = rect.width, h = rect.height;
            if (w === 0 || h === 0) { requestAnimationFrame(renderLobbyLoop); return; }

            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, w, h);

            const activePlayers = getRoomPlayers();
            activePlayers.forEach(p => {
                p.x += ((p.targetX ?? p.x) - p.x) * 0.1;
                p.y += ((p.targetY ?? p.y) - p.y) * 0.1;
                const px = p.x * w, py = p.y * h;

                ctx.save();
                ctx.translate(px, py);
                var pfeat = p.features || {};
                var pbody = PODLING_BODIES.find(function(b) { return b.id === pfeat.body; }) || PODLING_BODIES[0];
                var psprout = PODLING_SPROUTS.find(function(s) { return s.id === pfeat.sprout; }) || PODLING_SPROUTS[0];
                ctx.fillStyle = pbody.color;
                ctx.beginPath();
                ctx.roundRect(-15, -24, 30, 46, 15);
                ctx.fill();
                ctx.strokeStyle = 'rgba(15,23,42,0.35)';
                ctx.lineWidth = 2;
                ctx.setLineDash([3, 2.5]);
                ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 20); ctx.stroke();

                ctx.fillStyle = '#0f172a';
                ctx.strokeStyle = '#0f172a';
                if (pfeat.face === 'sleepy') {

                    ctx.beginPath(); ctx.arc(-7, -4, 4, 0.3, Math.PI - 0.3); ctx.stroke();

                ctx.lineWidth = 2;

        window.startMelodySequence = function() {
            playTone('win');
        };

        window.tapMelodyPad = function(idx) {
            playTone('pop', 300 + idx * 120); awardXP(1);
        };

        window.triggerReflexBuzzer = function() {
            playTone('win'); awardXP(5);
            document.getElementById('reflexResultText').textContent = `${myPlayer.name} buzzed first! (+50 pts)`;
        };

        // --- STREAMING_CHUNK:Chat & Cloud Sync... ---
        let chatMessages = [];
        function renderChatHistory() {
            const box = document.getElementById('chatHistoryBox');
            if (!box) return;
            box.innerHTML = chatMessages.slice(-6).map(m => `<div><span class="font-bold text-violet-300">${escapeHtml(m.sender)}:</span> ${escapeHtml(m.text)}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        window.handleSendChat = function(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            chatMessages.push({ sender: myPlayer.name, text: msg });
            renderChatHistory();
            playVocalChatBlips(msg, myPlayer.name);
            syncMyPlayerToCloud(); persistAll(); awardXP(1);
        };

        window.switchTab = function(tabName) {
            ['lounge', 'games', 'wardrobe'].forEach(t => {
                document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tabName);
            });
            playTone('pop');
            if (tabName === 'games') renderAllMiniGamesUI();
            if (tabName === 'wardrobe') initWardrobeUI();
        };

        window.openPixelWallModal = function() { document.getElementById('pixelWallModal').classList.remove('hidden'); playTone('pop'); };
        window.closePixelWallModal = function() { document.getElementById('pixelWallModal').classList.add('hidden'); };
        window.clearPixelWall = function() { pixelWallData = Array(96).fill('#0f172a'); };

        window.openSplashMenu = function() { document.getElementById('splashScreen').classList.remove('hidden'); };
        window.enterLoungeFromSplash = function() {
            const name = document.getElementById('splashNameInput').value.trim();
            const room = document.getElementById('splashRoomInput').value.trim().toUpperCase();
            if (!name) { playTone('pop'); document.getElementById('splashNameInput').focus(); return; }
            myPlayer.name = name;
            if (room) currentRoomCode = room;
            persistAll();
            document.getElementById('headerRoomText').textContent = currentRoomCode;
            document.getElementById('splashScreen').classList.add('hidden');
            playTone('win');
            initWardrobeUI();
            renderRosterBar();
            expandChrome();
        };

        window.openDeployModal = function() {
            document.getElementById('shareUrlInput').value = `${window.location.origin}${window.location.pathname}?room=${currentRoomCode}`;
            document.getElementById('deployModal').classList.remove('hidden');
        };
        window.closeDeployModal = function() { document.getElementById('deployModal').classList.add('hidden'); };
        window.copyShareLink = function() {
            navigator.clipboard.writeText(document.getElementById('shareUrlInput').value);
            playTone('win');
        };
        window.launchInstantCodePenDeploy = function() {
            playTone('win');
            document.getElementById('codepenFormData').value = JSON.stringify({ title: "CozyPod", html: "<!DOCTYPE html>\n" + document.documentElement.outerHTML });
            document.getElementById('codepenDeployForm').submit();
        };
        window.downloadStandaloneHtml = function() {
            const blob = new Blob(["<!DOCTYPE html>\n" + document.documentElement.outerHTML], { type: 'text/html' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'index.html'; a.click();
        };

        function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, s => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s])); }

        async function initFirebaseMultiplayer() {
            try {
                let firebaseConfig = EXTERNAL_FIREBASE_CONFIG || (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
                if (!firebaseConfig) return;
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app); db = getFirestore(app);
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
                isFirebaseReady = true;
                syncMyPlayerToCloud(); persistAll();
            } catch(e) {}
        }

        async function syncMyPlayerToCloud() {
            if (!isFirebaseReady || !auth?.currentUser) return;
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cozypod_players', myUserId), { ...myPlayer }); } catch(e){}
        }

        async function syncGameStateToCloud() {
            if (!isFirebaseReady || !auth?.currentUser) return;
            try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cozypod_games', `room_${currentRoomCode}`), { ...sharedGameState }); } catch(e){}
        }


        // ===== COZYPOD LOCAL SAVE · XP · DAILY REWARDS =====
        const SAVE_KEY = 'cozypod_save_v1';
        let saveData = null;
        let playerXP = 0, playerLevel = 1;
        function loadSaveData() {
            try { saveData = JSON.parse(localStorage.getItem(SAVE_KEY)) || null; } catch (e) { saveData = null; }
            if (!saveData || typeof saveData !== 'object') saveData = null;
            if (!saveData) {
                saveData = {
                    uid: 'local-' + Math.random().toString(36).substring(2, 8),
                    player: null, env: { weather: 'none', gravity: 'normal' },
                    xp: 0, level: 1, coins: 50, trophies: [],
                    daily: { lastClaim: '', streak: 0 }
                };
            }
            if (!saveData.uid) saveData.uid = 'local-' + Math.random().toString(36).substring(2, 8);
            if (!saveData.env) saveData.env = { weather: 'none', gravity: 'normal' };
            if (!Array.isArray(saveData.trophies)) saveData.trophies = [];
            if (!saveData.daily) saveData.daily = { lastClaim: '', streak: 0 };
            return saveData;
        }
        function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) {} }
        function persistAll() {
            saveData.player = { name: myPlayer.name, status: myPlayer.status, species: 'podling',
                features: Object.assign({ body: 'mint', sprout: 'leaf', face: 'happy' }, myPlayer.features) };
            saveData.env = { weather: roomWeather, gravity: roomGravity };
            saveData.coins = arcadeCoins; saveData.xp = playerXP; saveData.level = playerLevel;
            writeSave();
        }
        function persistCoins() { saveData.coins = arcadeCoins; writeSave(); }
        function applySaveData() {
            loadSaveData();
            myUserId = saveData.uid; myPlayer.id = myUserId;
            myPlayer.species = 'podling';
            var sfeat = (saveData.player && saveData.player.features) || null;
            var legFace = (saveData.player && saveData.player.eyes === 'starry') ? 'starry' : 'happy';
            myPlayer.features = {
                body: (sfeat && sfeat.body) || 'mint',
                sprout: (sfeat && sfeat.sprout) || 'leaf',
                face: (sfeat && sfeat.face) || legFace
            };
            if (saveData.player) {
                ['name','status'].forEach(function(f) {
                    if (saveData.player[f] !== undefined && saveData.player[f] !== null) myPlayer[f] = saveData.player[f];
                });
            }
            playersMap = {}; playersMap[myUserId] = myPlayer;
            roomWeather = saveData.env.weather || 'none';
            roomGravity = saveData.env.gravity || 'normal';
            arcadeCoins = (typeof saveData.coins === 'number') ? saveData.coins : 50;
            playerXP = saveData.xp || 0; playerLevel = saveData.level || 1;
            writeSave();
        }
        function xpForLevel(lv) { return lv * 100; }
        function renderXPBar() {
            var need = xpForLevel(playerLevel);
            document.getElementById('xpLevelLabel').textContent = 'Lv ' + playerLevel;
            document.getElementById('xpBarFill').style.width = Math.min(100, playerXP / need * 100) + '%';
            document.getElementById('xpTextLabel').textContent = playerXP + '/' + need;
        }
        function renderTrophyShelf() {
            var row = document.getElementById('trophyShelfRow'); if (!row) return;
            var icons = (saveData.trophies || []).map(function(t) { return t.t === 'weekly' ? '⭐' : '🏆'; });
            row.innerHTML = icons.length
                ? icons.map(function(e) { return '<span>' + e + '</span>'; }).join('')
                : '<span class="text-[10px] text-slate-500">Play to earn</span>';
        }
        function showRewardModal(emoji, title, detail) {
            document.getElementById('rewardEmoji').textContent = emoji;
            document.getElementById('rewardTitle').textContent = title;
            document.getElementById('rewardDetail').textContent = detail;
            document.getElementById('rewardModal').classList.remove('hidden');
        }
        window.closeRewardModal = function() {
            document.getElementById('rewardModal').classList.add('hidden');
            playTone('pop');
        };
        function awardXP(n) {
            playerXP += n;
            var leveled = false, lastBonus = 0;
            while (playerXP >= xpForLevel(playerLevel)) {
                playerXP -= xpForLevel(playerLevel);
                playerLevel++;
                lastBonus = 20 * playerLevel;
                arcadeCoins += lastBonus;
                saveData.trophies.push({ t: 'level', level: playerLevel });
                leveled = true;
            }
            persistAll();
            document.getElementById('coinCountVal').textContent = arcadeCoins;
            renderXPBar(); renderTrophyShelf();
            if (leveled) { playTone('win'); showRewardModal('🎉', 'Level ' + playerLevel + '!', '+' + lastBonus + ' coins'); }
        }
        function dayStr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
        function checkDailyReward() {
            var today = dayStr(new Date());
            if (saveData.daily.lastClaim === today) return;
            var yesterday = dayStr(new Date(Date.now() - 864e5));
            saveData.daily.streak = (saveData.daily.lastClaim === yesterday) ? saveData.daily.streak + 1 : 1;
            var streak = saveData.daily.streak;
            var weekly = (streak % 7 === 0);
            var coins = weekly ? 150 : 15 + 5 * streak;
            var xp = weekly ? 100 : 25;
            saveData.daily.lastClaim = today;
            arcadeCoins += coins;
            if (weekly) saveData.trophies.push({ t: 'weekly', streak: streak });
            persistAll();
            document.getElementById('coinCountVal').textContent = arcadeCoins;
            awardXP(xp);
            renderTrophyShelf();
            showRewardModal(weekly ? '⭐' : '🎁', weekly ? 'Weekly Bonus!' : 'Day ' + streak, '+' + coins + ' coins · +' + xp + ' XP');
        }
        applySaveData();

        /* ---------- Collapsible chrome: header/footer auto-hide ---------- */
        const CHROME_IDLE_MS = 3000;
        let chromeIdleTimer = null;
        const appHeaderEl = document.getElementById('appHeader');
        const appNavEl = document.getElementById('appNav');
        const topPillEl = document.getElementById('topChromePill');
        const bottomPillEl = document.getElementById('bottomChromePill');

        function loungeActive() {
            const sp = document.getElementById('splashScreen');
            return sp && sp.classList.contains('hidden');
        }
        function syncChromeHeights() {
            const collapsed = document.body.classList.contains('chrome-collapsed');
            [appHeaderEl, appNavEl].forEach(function(el) {
                if (!el) return;
                el.style.maxHeight = 'none';
                const full = el.scrollHeight;
                el.style.maxHeight = collapsed ? '0px' : full + 'px';
            });
        }
        function setChromeCollapsed(collapsed) {
            document.body.classList.toggle('chrome-collapsed', collapsed);
            if (topPillEl) topPillEl.classList.toggle('hidden', !collapsed);
            if (bottomPillEl) bottomPillEl.classList.toggle('hidden', !collapsed);
            syncChromeHeights();
        }
        function restartChromeIdle() {
            clearTimeout(chromeIdleTimer);
            chromeIdleTimer = setTimeout(function() {
                if (loungeActive()) setChromeCollapsed(true);
            }, CHROME_IDLE_MS);
        }
        window.expandChrome = function() { setChromeCollapsed(false); restartChromeIdle(); };
        window.collapseChrome = function() { if (loungeActive()) setChromeCollapsed(true); };

        function chromeInputHandler(e) {
            if (!loungeActive()) return;
            const t = e.target;
            const onChrome = t && t.closest && t.closest('#appHeader, #appNav, #topChromePill, #bottomChromePill');
            if (onChrome) { restartChromeIdle(); return; }
            setChromeCollapsed(true);
            restartChromeIdle();
        }
        ['pointerdown', 'wheel', 'keydown'].forEach(function(evt) {
            document.addEventListener(evt, chromeInputHandler, { capture: true, passive: true });
        });
        window.addEventListener('resize', syncChromeHeights);

        /* ---------- Non-gaming interaction lockdown ---------- */
        document.addEventListener('contextmenu', function(e) {
            if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
            e.preventDefault();
        });
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(e) {
            const now = Date.now();
            if (now - lastTouchEnd < 300 && !(e.target && e.target.closest && e.target.closest('input, textarea, select'))) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, { passive: false });

        window.onload = function() {
            syncChromeHeights();
            document.getElementById('headerRoomText').textContent = currentRoomCode;
            document.getElementById('splashRoomInput').value = currentRoomCode;
            document.getElementById('splashAvatarPreview').innerHTML = buildAvatarSVG(myPlayer, 44);
            resizeCanvas();
            initWardrobeUI();
            renderRosterBar();
            renderAllMiniGamesUI();
            requestAnimationFrame(renderLobbyLoop);
            document.getElementById('coinCountVal').textContent = arcadeCoins;
            document.getElementById('splashNameInput').value = myPlayer.name;
            renderXPBar();
            renderTrophyShelf();
            checkDailyReward();
            initFirebaseMultiplayer();
        };
    </script>
</body>
</html>
